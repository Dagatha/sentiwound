<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>SentiWound BLE</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:system-ui;background:#1a1a2e;color:#fff;padding:15px;min-height:100vh}
        .c{max-width:400px;margin:0 auto}
        h1{text-align:center;margin-bottom:15px}
        .s{border-radius:14px;padding:20px;text-align:center;margin-bottom:12px;background:#9C27B0}
        .e{font-size:40px}.t{font-size:22px;font-weight:700}.r{font-size:36px;font-weight:700}
        .m{background:rgba(255,255,255,.1);border-radius:8px;padding:10px;text-align:center;margin-bottom:10px}
        .bac{background:#F44336;border-radius:8px;padding:12px;text-align:center;margin-bottom:10px;font-weight:700;display:none}
        .bac.show{display:block;animation:pulse 1s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.7}}
        .trend{background:rgba(255,255,255,.1);border-radius:8px;padding:10px;text-align:center;margin-bottom:10px;display:none}
        .trend.show{display:block}
        .trend.improving{background:rgba(76,175,80,.3)}
        .trend.worsening{background:rgba(244,67,54,.3)}
        .trend.stable{background:rgba(33,150,243,.3)}
        .conf{background:rgba(255,255,255,.05);border-radius:8px;padding:8px;text-align:center;margin-bottom:10px;font-size:12px}
        .conf-bar{height:6px;background:rgba(255,255,255,.2);border-radius:3px;margin-top:5px;overflow:hidden}
        .conf-fill{height:100%;background:#4CAF50;border-radius:3px;transition:width 0.3s}
        .step{background:#FF9800;color:#000;border-radius:8px;padding:12px;text-align:center;margin-bottom:10px;font-weight:700;display:none}
        .cd{background:rgba(255,152,0,.3);border-radius:8px;padding:10px;text-align:center;margin-bottom:10px;font-size:22px;font-weight:700;display:none}
        .g{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
        button{background:rgba(255,255,255,.15);border:none;border-radius:10px;padding:14px;color:#fff;font-size:14px;font-weight:600;cursor:pointer}
        button:disabled{opacity:0.4}
        .conn{background:#2196F3;grid-column:span 2;font-size:16px}
        .p{background:#4CAF50}.d{background:#F44336}
        .mt{background:rgba(255,255,255,.1);border-radius:10px;padding:12px;font-size:13px}
        .mr{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.1)}
        .mr:last-child{border:none}.ml{opacity:.6}
        .rec{background:rgba(255,193,7,.2);border-radius:8px;padding:10px;margin-bottom:10px;font-size:13px;display:none}
        .rec.show{display:block}
        .rec-title{font-weight:700;margin-bottom:5px}
    </style>
</head>
<body>
<div class="c">
    <h1>🩹 SentiWound</h1>
    
    <!-- Status Card -->
    <div class="s" id="sbox">
        <div class="e" id="icon">🟣</div>
        <div class="t" id="status">READY</div>
        <div class="r"><span id="score">0</span></div>
        <small>Risk Score</small>
    </div>
    
    <!-- Bacteria Detection -->
    <div class="bac" id="bacbox">
        <span id="baccolor">🦠</span> <span id="bacteria">Unknown</span> Detected!
        <div style="font-size:12px;margin-top:5px;opacity:0.9">Confidence: <span id="bacconf">0</span>%</div>
    </div>
    
    <!-- Trend Analysis -->
    <div class="trend" id="trendbox">
        <span id="trendarrow">➖</span> <span id="trendmsg">Analyzing...</span>
    </div>
    
    <!-- Recommendation -->
    <div class="rec" id="recbox">
        <div class="rec-title">💡 Recommendation</div>
        <div id="rectext">Continue monitoring</div>
    </div>
    
    <!-- Message -->
    <div class="m" id="msg">Tap Connect to start</div>
    
    <!-- Confidence Bar -->
    <div class="conf" id="confbox">
        Reading Confidence: <span id="conflevel">--</span>
        <div class="conf-bar"><div class="conf-fill" id="confbar" style="width:0%"></div></div>
    </div>
    
    <!-- Step/Countdown -->
    <div class="step" id="stepbox">📍 <span id="step"></span></div>
    <div class="cd" id="cdbox">Reading in <span id="cd">5</span>s...</div>
    
    <!-- Buttons -->
    <div class="g">
        <button class="conn" id="connbtn">🔗 Connect</button>
        <button onclick="cmd('calibrate')" disabled>🎯 Calibrate</button>
        <button onclick="cmd('single')" disabled>📷 Single</button>
        <button onclick="cmd('quick_demo')" disabled>🎬 Quick Demo</button>
        <button onclick="cmd('extended_demo')" disabled>🎭 Full Demo</button>
        <button class="p" onclick="cmd('start')" disabled>▶️ Monitor</button>
        <button class="d" onclick="cmd('stop')" disabled>⏹️ Stop</button>
    </div>
    
    <!-- Metrics -->
    <div class="mt">
        <div class="mr"><span class="ml">Fluorescence</span><span id="ratio">1.00x</span></div>
        <div class="mr"><span class="ml">UV OFF</span><span id="uvoff">0</span></div>
        <div class="mr"><span class="ml">UV ON</span><span id="uvon">0</span></div>
        <div class="mr"><span class="ml">Temp</span><span id="temp">N/A</span></div>
        <div class="mr"><span class="ml">Healing Score</span><span id="healing">--</span></div>
        <div class="mr"><span class="ml">Readings</span><span id="count">#0</span></div>
    </div>
    
    <div style="text-align:center;margin-top:15px;font-size:11px;opacity:0.5">
        SentiWound v2.8 • UV Fluorescence Detection
    </div>
</div>

<script>
const SVC='12345678-1234-5678-1234-56789abcdef0';
const CMD='12345678-1234-5678-1234-56789abcdef1';
const DAT='12345678-1234-5678-1234-56789abcdef2';

const col={HEALTHY:'#4CAF50',WATCH:'#2196F3',CONCERN:'#FF9800',ALERT:'#F44336',READY:'#9C27B0',INVALID:'#607D8B',RETRY:'#9E9E9E'};
const ico={HEALTHY:'💚',WATCH:'🔵',CONCERN:'⚠️',ALERT:'🚨',READY:'🟣',INVALID:'❌',RETRY:'🔄'};

let cmdC;
let lastStatus = '';

// Sound alert for ALERT status
function playAlert() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 800;
        osc.type = 'square';
        gain.gain.value = 0.2;
        
        osc.start();
        setTimeout(() => {
            osc.stop();
            // Second beep
            const osc2 = ctx.createOscillator();
            osc2.connect(gain);
            osc2.frequency.value = 1000;
            osc2.type = 'square';
            osc2.start();
            setTimeout(() => osc2.stop(), 150);
        }, 200);
    } catch(e) {}
}

// Connect button handler
document.getElementById('connbtn').onclick = async () => {
    try {
        document.getElementById('connbtn').textContent = 'Connecting...';
        const dev = await navigator.bluetooth.requestDevice({
            filters: [{name: 'SentiWound'}],
            optionalServices: [SVC]
        });
        const srv = await dev.gatt.connect();
        const svc = await srv.getPrimaryService(SVC);
        cmdC = await svc.getCharacteristic(CMD);
        const datC = await svc.getCharacteristic(DAT);
        await datC.startNotifications();
        
        datC.addEventListener('characteristicvaluechanged', e => {
            const d = JSON.parse(new TextDecoder().decode(e.target.value));
            updateUI(d);
        });
        
        document.getElementById('connbtn').textContent = '✓ Connected';
        document.getElementById('connbtn').style.background = '#4CAF50';
        document.getElementById('msg').textContent = 'Connected! Tap a button.';
        document.querySelectorAll('button').forEach(b => b.disabled = false);
    } catch(e) {
        document.getElementById('connbtn').textContent = '🔗 Connect';
        document.getElementById('msg').textContent = 'Failed: ' + e.message;
    }
};

function updateUI(d) {
    // Handle both full and short key names
    const status = d.status || d.s || 'READY';
    const score = d.score || d.sc || 0;
    const ratio = d.ratio || d.r || 1.0;
    const clear = d.clear || d.c || 0;
    const clear_off = d.clear_off || d.co || 0;
    const msg = d.msg || d.m || '';
    const bacteria = d.bacteria || d.b || 'None';
    const trend = d.trend || d.t || '';
    const step = d.step || d.st || '';
    const countdown = d.countdown || d.cd || 0;
    const confidence = d.confidence || d.cf || 100;
    const temp = d.temp || d.tp || null;
    
    // Status display
    document.getElementById('status').textContent = status;
    document.getElementById('score').textContent = Math.round(score);
    document.getElementById('icon').textContent = ico[status] || '❓';
    document.getElementById('sbox').style.background = col[status] || '#9E9E9E';
    
    // Sound alert
    if (status === 'ALERT' && lastStatus !== 'ALERT') playAlert();
    lastStatus = status;
    
    // Message
    document.getElementById('msg').textContent = msg;
    
    // Readings
    document.getElementById('ratio').textContent = ratio.toFixed(2) + 'x';
    document.getElementById('uvoff').textContent = clear_off;
    document.getElementById('uvon').textContent = clear;
    document.getElementById('temp').textContent = temp ? temp.toFixed(1) + '°C' : 'N/A';
    
    // Bacteria
    const bacBox = document.getElementById('bacbox');
    if (bacteria && bacteria !== 'None') {
        document.getElementById('bacteria').textContent = bacteria;
        bacBox.classList.add('show');
    } else {
        bacBox.classList.remove('show');
    }
    
    // Trend
    const trendBox = document.getElementById('trendbox');
    if (trend && trend !== 'INSUFFICIENT_DATA' && trend !== '') {
        document.getElementById('trendarrow').textContent = 
            trend === 'IMPROVING' ? '📉' : trend === 'WORSENING' ? '📈' : '➡️';
        document.getElementById('trendmsg').textContent = trend;
        trendBox.classList.add('show');
    } else {
        trendBox.classList.remove('show');
    }
    
    // Confidence bar
    document.getElementById('confbar').style.width = confidence + '%';
    document.getElementById('conflevel').textContent = 
        confidence >= 80 ? 'HIGH' : confidence >= 50 ? 'MEDIUM' : 'LOW';
    
    // Step/countdown
    document.getElementById('stepbox').style.display = step ? 'block' : 'none';
    document.getElementById('step').textContent = step;
    document.getElementById('cdbox').style.display = countdown > 0 ? 'block' : 'none';
    document.getElementById('cd').textContent = countdown;
}

async function cmd(c) {
    if (cmdC) await cmdC.writeValue(new TextEncoder().encode(c));
}
</script>
</body>
</html>
