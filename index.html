<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SentiWound</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,sans-serif;background:linear-gradient(135deg,#1a1a2e,#16213e);color:#fff;min-height:100vh;padding:12px}
        .c{max-width:400px;margin:0 auto}
        h1{text-align:center;font-size:22px;margin-bottom:15px}
        .sc{background:#9E9E9E;border-radius:16px;padding:20px;text-align:center;margin-bottom:12px}
        .sc .i{font-size:44px}.sc .s{font-size:24px;font-weight:700;margin:8px 0}.sc .n{font-size:42px;font-weight:700}.sc .l{font-size:11px;opacity:.8}
        .hc{background:linear-gradient(135deg,#1565c0,#0d47a1);border-radius:12px;padding:14px;margin-bottom:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
        .hi{text-align:center}.hi .v{font-size:28px;font-weight:700}.hi .l{font-size:10px;opacity:.8}
        .sb{border-radius:10px;padding:10px;margin-bottom:12px;text-align:center;display:none}
        .sb.show{display:block}.sb.EARLY{background:#ffc107;color:#000}.sb.MOD{background:#ff9800}.sb.SEV{background:#f44336}
        .bb{background:linear-gradient(135deg,#7b1fa2,#4a148c);border-radius:10px;padding:12px;margin-bottom:12px;text-align:center;display:none}
        .bb.show{display:block}.bb .t{font-size:11px;opacity:.8}.bb .n{font-size:18px;font-weight:700;margin-top:4px}
        .ms{background:rgba(255,255,255,.1);border-radius:10px;padding:12px;text-align:center;margin-bottom:12px;font-size:13px;min-height:42px}
        .sp{background:linear-gradient(135deg,#FF9800,#F57C00);color:#000;border-radius:10px;padding:12px;text-align:center;margin-bottom:10px;font-weight:600;display:none}
        .sp.show{display:block}
        .cd{background:rgba(255,152,0,.3);border-radius:50%;width:70px;height:70px;display:none;align-items:center;justify-content:center;font-size:32px;font-weight:700;margin:0 auto 12px}
        .cd.show{display:flex}
        .bg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
        button{background:rgba(255,255,255,.15);border:none;border-radius:10px;padding:12px 8px;color:#fff;font-size:13px;font-weight:600;cursor:pointer}
        button:disabled{opacity:.4}
        .bc{background:#2196F3;grid-column:span 2;font-size:16px}
        .bs{background:#4CAF50}.bt{background:#F44336}
        .sec{background:rgba(255,255,255,.05);border-radius:10px;padding:10px;margin-bottom:12px}
        .sec-t{font-size:11px;opacity:.7;margin-bottom:8px;text-align:center}
        .bg3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
        .bh{background:#4CAF50}.bi{background:#F44336}.bf{background:#FF9800}
        .bsm{padding:10px 6px;font-size:11px}
        .bg4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}
        .bd{background:#607D8B;font-size:10px;padding:8px 4px}
        .mt{background:rgba(255,255,255,.08);border-radius:10px;padding:10px;font-size:12px}
        .mr{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.1)}
        .mr:last-child{border:none}.ml{opacity:.6}
        .ft{text-align:center;font-size:10px;opacity:.4;margin-top:15px}
    </style>
</head>
<body>
<div class="c">
    <h1>🩹 SentiWound</h1>
    <div class="sc" id="sCard"><div class="i" id="icon">⏳</div><div class="s" id="status">READY</div><div class="n" id="score">0</div><div class="l">Risk Score</div></div>
    <div class="hc"><div class="hi"><div class="v" id="hs">--</div><div class="l">💊 HEALING SCORE™</div></div><div class="hi"><div class="v" id="days">--</div><div class="l">📅 Days to Heal</div></div></div>
    <div class="sb" id="stage"><span id="stageT"></span></div>
    <div class="bb" id="bac"><div class="t">🦠 Bacteria</div><div class="n" id="bacN">--</div></div>
    <div class="ms" id="msg">Connect to begin...</div>
    <div class="sp" id="step"></div>
    <div class="cd" id="cd"></div>
    <div class="bg">
        <button class="bc" id="conn">🔗 Connect</button>
        <button onclick="cmd('calibrate')" disabled>🎯 Quick Cal</button>
        <button onclick="cmd('auto_calibrate')" disabled>📐 Auto Cal</button>
        <button onclick="cmd('single')" disabled>📷 Single</button>
        <button onclick="cmd('quick_demo')" disabled>🎬 Quick Demo</button>
        <button onclick="cmd('extended_demo')" disabled>🎭 Full Demo</button>
        <button class="bs" onclick="cmd('start')" disabled>▶️ Monitor</button>
        <button class="bt" onclick="cmd('stop')" disabled>⏹️ Stop</button>
    </div>
    <div class="sec"><div class="sec-t">🧠 Train AI</div><div class="bg3">
        <button class="bh bsm" id="lh" onclick="lbl('healthy')" disabled>✓ Healthy</button>
        <button class="bi bsm" id="li" onclick="lbl('infected')" disabled>✗ Infected</button>
        <button class="bf bsm" id="lf" onclick="lbl('false')" disabled>⚠ False</button>
    </div></div>
    <div class="sec"><div class="sec-t">📊 Data</div><div class="bg4">
        <button class="bd" onclick="cmd('export')" disabled>📤</button>
        <button class="bd" onclick="cmd('knn_stats')" disabled>🧠</button>
        <button class="bd" onclick="cmd('history_clear')" disabled>📜</button>
        <button class="bd" onclick="cmd('clear_all')" disabled>🗑️</button>
    </div></div>
    <div class="mt">
        <div class="mr"><span class="ml">Fluorescence</span><span id="ratio">--</span></div>
        <div class="mr"><span class="ml">UV</span><span id="uv">--</span></div>
        <div class="mr"><span class="ml">Temp</span><span id="temp">--</span></div>
    </div>
    <div class="ft">SentiWound v4.1</div>
</div>
<script>
const I={HEALTHY:'💚',WATCH:'🔵',CONCERN:'⚠️',ALERT:'🚨',READY:'⏳'};
const C={HEALTHY:'#4CAF50',WATCH:'#2196F3',CONCERN:'#FF9800',ALERT:'#F44336',READY:'#9E9E9E'};
const S={EARLY:'🟡 EARLY',MOD:'🟠 MODERATE',SEV:'🔴 SEVERE'};
let dev,cmdC,datC,lastS='';

document.getElementById('conn').onclick=async()=>{
    try{
        dev=await navigator.bluetooth.requestDevice({filters:[{name:'SentiWound'}],optionalServices:['12345678-1234-5678-1234-56789abcdef0']});
        dev.addEventListener('gattserverdisconnected',disc);
        const srv=await dev.gatt.connect();
        const svc=await srv.getPrimaryService('12345678-1234-5678-1234-56789abcdef0');
        cmdC=await svc.getCharacteristic('12345678-1234-5678-1234-56789abcdef1');
        datC=await svc.getCharacteristic('12345678-1234-5678-1234-56789abcdef2');
        await datC.startNotifications();
        datC.addEventListener('characteristicvaluechanged',onD);
        document.querySelectorAll('button').forEach(b=>b.disabled=false);
        document.getElementById('conn').textContent='✅ Connected';
        document.getElementById('msg').textContent='Ready!';
    }catch(e){document.getElementById('msg').textContent='Failed';}
};

function disc(){
    document.querySelectorAll('button').forEach(b=>b.disabled=true);
    document.getElementById('conn').disabled=false;
    document.getElementById('conn').textContent='🔗 Connect';
    document.getElementById('msg').textContent='Disconnected';
}

function onD(e){try{upd(JSON.parse(new TextDecoder().decode(e.target.value)));}catch(er){}}

async function cmd(c){if(cmdC)try{await cmdC.writeValue(new TextEncoder().encode(c));}catch(e){}}

async function lbl(t){
    const b=document.getElementById('l'+t[0]);
    const o=b.textContent;b.textContent='...';
    await cmd('label_'+t);
    setTimeout(()=>{b.textContent='✓';setTimeout(()=>b.textContent=o,800);},200);
}

function upd(d){
    // Status
    if(d.st){
        document.getElementById('status').textContent=d.st;
        document.getElementById('icon').textContent=I[d.st]||'❓';
        document.getElementById('sCard').style.background=C[d.st]||'#9E9E9E';
        if(d.st==='ALERT'&&lastS!=='ALERT')try{new(window.AudioContext||window.webkitAudioContext)().createOscillator().start();}catch(e){}
        lastS=d.st;
    }
    if(d.sc!==undefined)document.getElementById('score').textContent=Math.round(d.sc);
    
    // Healing
    if(d.hs!==undefined){
        const h=document.getElementById('hs');
        h.textContent=d.hs;
        h.style.color=d.hs>=70?'#4caf50':d.hs>=40?'#ffeb3b':'#ff5722';
    }
    if(d.dy!==undefined){
        const y=document.getElementById('days');
        y.textContent=d.dy===0?'✓':d.dy<0?'⚠️':d.dy+'d';
    }
    
    // Stage
    const sb=document.getElementById('stage');
    if(d.sg&&d.sg!=='NONE'){
        sb.className='sb show '+d.sg;
        document.getElementById('stageT').textContent=S[d.sg]||d.sg;
    }else sb.className='sb';
    
    // Bacteria
    const bb=document.getElementById('bac');
    if(d.ba){document.getElementById('bacN').textContent=d.ba;bb.classList.add('show');}
    else bb.classList.remove('show');
    
    // Message
    if(d.ms)document.getElementById('msg').textContent=d.ms;
    
    // Step
    const sp=document.getElementById('step');
    if(d.sp&&d.sp.length>0){sp.textContent=d.sp;sp.classList.add('show');}
    else sp.classList.remove('show');
    
    // Countdown
    const cd=document.getElementById('cd');
    if(d.cd&&d.cd>0){cd.textContent=d.cd;cd.classList.add('show');}
    else cd.classList.remove('show');
    
    // Metrics
    if(d.rt!==undefined)document.getElementById('ratio').textContent=d.rt.toFixed(2)+'x';
    if(d.uo!==undefined&&d.un!==undefined)document.getElementById('uv').textContent=d.uo+'→'+d.un;
    if(d.tp)document.getElementById('temp').textContent=d.tp.toFixed(1)+'°C';
}
</script>
</body>
</html>
