<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SentiWound</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            padding: 12px;
        }
        .container { max-width: 400px; margin: 0 auto; }
        h1 { text-align: center; font-size: 22px; margin-bottom: 15px; }
        
        /* Status Card */
        .status-card {
            background: #9E9E9E;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 12px;
            transition: all 0.3s;
        }
        .status-card .icon { font-size: 44px; }
        .status-card .status { font-size: 24px; font-weight: 700; margin: 8px 0; }
        .status-card .score { font-size: 42px; font-weight: 700; }
        .status-card .label { font-size: 11px; opacity: 0.8; }
        
        /* Alert Box */
        .alert-box {
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            text-align: center;
            font-weight: 600;
            font-size: 13px;
            display: none;
            animation: pulse 1.5s infinite;
        }
        .alert-box.alert { background: linear-gradient(135deg, #d32f2f, #b71c1c); }
        .alert-box.concern { background: linear-gradient(135deg, #f57c00, #e65100); }
        .alert-box.show { display: block; }
        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.98); opacity: 0.85; }
        }
        
        /* Message */
        .msg {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            margin-bottom: 12px;
            font-size: 13px;
            min-height: 42px;
        }
        
        /* Step & Countdown */
        .step-box {
            background: linear-gradient(135deg, #FF9800, #F57C00);
            color: #000;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            margin-bottom: 10px;
            font-weight: 600;
            display: none;
        }
        .step-box.show { display: block; }
        .countdown {
            background: rgba(255,152,0,0.3);
            border-radius: 50%;
            width: 70px;
            height: 70px;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            margin: 0 auto 12px;
        }
        .countdown.show { display: flex; }
        
        /* Button Grid */
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 12px;
        }
        button {
            background: rgba(255,255,255,0.15);
            border: none;
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        button:active { transform: scale(0.95); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-connect { background: #2196F3; grid-column: span 2; font-size: 15px; }
        .btn-connect.connected { background: #4CAF50; }
        .btn-start { background: #4CAF50; }
        .btn-stop { background: #F44336; }
        .btn-full { grid-column: span 2; }
        
        /* ML Section */
        .section {
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .section-title {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 10px;
            text-align: center;
        }
        .btn-grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
        }
        .btn-healthy { background: #4CAF50; }
        .btn-infected { background: #F44336; }
        .btn-false { background: #FF9800; }
        .btn-small { padding: 10px 6px; font-size: 11px; }
        
        /* Data Section */
        .btn-grid-4 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 6px;
        }
        .btn-data { background: #607D8B; font-size: 10px; padding: 8px 4px; }
        
        /* Bacteria Box */
        .bacteria-box {
            background: linear-gradient(135deg, #7b1fa2, #4a148c);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            text-align: center;
            display: none;
        }
        .bacteria-box.show { display: block; }
        .bacteria-box .title { font-size: 11px; opacity: 0.8; }
        .bacteria-box .name { font-size: 18px; font-weight: 700; margin-top: 4px; }
        
        /* Trend Box */
        .trend-box {
            background: rgba(33,150,243,0.2);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 12px;
            text-align: center;
            display: none;
        }
        .trend-box.show { display: block; }
        .trend-box .arrow { font-size: 22px; }
        .trend-box .text { font-size: 13px; }
        
        /* Confidence */
        .conf-section {
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 12px;
        }
        .conf-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            margin-bottom: 6px;
        }
        .conf-bar {
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            overflow: hidden;
        }
        .conf-fill {
            height: 100%;
            background: #4CAF50;
            border-radius: 3px;
            transition: all 0.3s;
        }
        
        /* Metrics */
        .metrics {
            background: rgba(255,255,255,0.08);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 12px;
        }
        .metric {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            font-size: 13px;
        }
        .metric:last-child { border: none; }
        .metric-label { opacity: 0.6; }
        
        /* Footer */
        .footer {
            text-align: center;
            font-size: 10px;
            opacity: 0.5;
            margin-top: 15px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>🩹 SentiWound</h1>
    
    <!-- Status Card -->
    <div class="status-card" id="statusCard">
        <div class="icon" id="icon">⏳</div>
        <div class="status" id="status">READY</div>
        <div class="score" id="score">0</div>
        <div class="label">Risk Score</div>
    </div>
    
    <!-- Alert Box -->
    <div class="alert-box" id="alertBox"></div>
    
    <!-- Message -->
    <div class="msg" id="msg">Connect to begin...</div>
    
    <!-- Step & Countdown -->
    <div class="step-box" id="stepBox"></div>
    <div class="countdown" id="countdown"></div>
    
    <!-- Main Buttons -->
    <div class="btn-grid">
        <button class="btn-connect" id="connectBtn">🔗 Connect</button>
        <button onclick="cmd('calibrate')" disabled>🎯 Quick Cal</button>
        <button onclick="cmd('auto_calibrate')" disabled>📐 Auto Cal</button>
        <button onclick="cmd('single')" disabled>📷 Single</button>
        <button onclick="cmd('quick_demo')" disabled>🎬 Quick Demo</button>
        <button onclick="cmd('extended_demo')" disabled>🎭 Full Demo</button>
        <button class="btn-start" onclick="cmd('start')" disabled>▶️ Monitor</button>
        <button class="btn-stop" onclick="cmd('stop')" disabled>⏹️ Stop</button>
    </div>
    
    <!-- ML Training -->
    <div class="section">
        <div class="section-title">🧠 Train AI - Label Last Reading</div>
        <div class="btn-grid-3">
            <button class="btn-healthy btn-small" onclick="cmd('label_healthy')" disabled>✓ Healthy</button>
            <button class="btn-infected btn-small" onclick="cmd('label_infected')" disabled>✗ Infected</button>
            <button class="btn-false btn-small" onclick="cmd('label_false')" disabled>⚠ False</button>
        </div>
    </div>
    
    <!-- Data Management -->
    <div class="section">
        <div class="section-title">📊 Data Management</div>
        <div class="btn-grid-4">
            <button class="btn-data" onclick="cmd('export')" disabled>📤 Export</button>
            <button class="btn-data" onclick="cmd('summary')" disabled>📈 Summary</button>
            <button class="btn-data" onclick="cmd('knn_stats')" disabled>🧠 KNN</button>
            <button class="btn-data" onclick="cmd('clear_all')" disabled>🗑️ Clear</button>
        </div>
    </div>
    
    <!-- Bacteria Detection -->
    <div class="bacteria-box" id="bacteriaBox">
        <div class="title">🦠 Bacteria Detected</div>
        <div class="name" id="bacteria">--</div>
    </div>
    
    <!-- Trend -->
    <div class="trend-box" id="trendBox">
        <span class="arrow" id="trendArrow">➡️</span>
        <span class="text" id="trendText">Stable</span>
    </div>
    
    <!-- Confidence -->
    <div class="conf-section">
        <div class="conf-header">
            <span>Confidence</span>
            <span id="confLevel">--</span>
        </div>
        <div class="conf-bar">
            <div class="conf-fill" id="confBar" style="width:0%"></div>
        </div>
    </div>
    
    <!-- Metrics -->
    <div class="metrics">
        <div class="metric">
            <span class="metric-label">Fluorescence</span>
            <span id="ratio">1.00x</span>
        </div>
        <div class="metric">
            <span class="metric-label">UV OFF → ON</span>
            <span><span id="uvOff">0</span> → <span id="uvOn">0</span></span>
        </div>
        <div class="metric">
            <span class="metric-label">Temperature</span>
            <span id="temp">--</span>
        </div>
        <div class="metric">
            <span class="metric-label">Readings</span>
            <span id="count">#0</span>
        </div>
    </div>
    
    <div class="footer">SentiWound v3.6 • Optimized</div>
</div>

<!-- Alert Sound -->
<audio id="alertSound" preload="auto">
    <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1sbJisr62gkIFqYGtziqS0u7ipl4N0X19wg6CyurmtoYZ5aV1rfZOqtbi1qJqLfm9hanKJnq2vq6CShXlvaW10ipqmp6KYjoN5cW5ydoiWoKGflo6FfHRwcnmFk5qamZKKgXt2c3R7hpKZmZaQiYF8d3N3fIiTl5WTjYZ/eXZ3fIOQlZSRjIWAend3fIKLkZGPi4WBfHh3eX6Hjo+OjIeDfnp4en6Ei4+OjImEgHx5en2DipCOjYmFgn57e3+EipGQjouHhIB9e36Ch42PjoyJhoOAfn6Bg4uOjoyKh4WCf36AgomNjo2LiIWDgH+AgoiLjIuKiIWDgYCAgoaKi4qJh4WDgoGBg4aJioqIh4WEgoGBg4WIiYmIh4aEg4KCg4WHiIiHhoWEg4KChIaHiIeGhYSEg4ODhYaHh4aFhISEg4OEhYaGhoWFhISDg4OEhYaGhYSEhIODg4SEhYaFhIODg4KCg4SEhYWFhIODgoKCgoOEhIWEg4OCgoGBgoODhISDgoKBgYGBgYKDg4OCgoGAgYGBgYKCg4OCgYGBgIGBgYKCgoKBgYGAgICBgYKCgoGBgYCAgICBgYGCgoGBgIB/f4CAgYGBgYGBgIB/f3+AgIGBgYGAgIB/f3+AgIGBgYCAgIB/f3+AgICBgYCAgIB/fn9/gICAgYCAgH9/f35/f4CAgICAgH9/f35/f4CAgIB/f39/fn5/f4CAgIB/f39+fn5/f4CAf39/f35+fn9/f4B/f39/fn5+f39/f39/f35+fn5+f39/f39/fn5+fn5+f39/f35+fn5+fn5/f39/fn5+fn5+fn9/f35+fn5+fn5+f39/fn5+fn5+fn5/f35+fn5+fn5+fn5+fn5+fn5+fn5+fn5+fn5+fn5+fn5+fn5+fn5+fn5+fn5+fn5+fn5+fn5+" type="audio/wav">
</audio>

<script>
// State
let device, cmdChar, dataChar;
let lastStatus = '';
let readingCount = 0;

// Status config
const colors = {
    HEALTHY: '#4CAF50', WATCH: '#2196F3',
    CONCERN: '#FF9800', ALERT: '#F44336', READY: '#9E9E9E'
};
const icons = {
    HEALTHY: '💚', WATCH: '🔵',
    CONCERN: '⚠️', ALERT: '🚨', READY: '⏳'
};
const fullMessages = {
    HEALTHY: 'Wound appears healthy - continue normal care',
    WATCH: 'Minor changes detected - monitor closely',
    CONCERN: 'Signs of possible infection - see doctor within 24 hours',
    ALERT: 'Seek medical attention immediately'
};
const alertMessages = {
    ALERT: '🚨 ACTIVE INFECTION - SEEK MEDICAL ATTENTION IMMEDIATELY',
    CONCERN: '⚠️ Signs of infection - consult doctor within 24 hours'
};

// Connect handler
document.getElementById('connectBtn').onclick = async () => {
    try {
        device = await navigator.bluetooth.requestDevice({
            filters: [{ name: 'SentiWound' }],
            optionalServices: ['12345678-1234-5678-1234-56789abcdef0']
        });
        
        device.addEventListener('gattserverdisconnected', onDisconnect);
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService('12345678-1234-5678-1234-56789abcdef0');
        
        cmdChar = await service.getCharacteristic('12345678-1234-5678-1234-56789abcdef1');
        dataChar = await service.getCharacteristic('12345678-1234-5678-1234-56789abcdef2');
        
        await dataChar.startNotifications();
        dataChar.addEventListener('characteristicvaluechanged', onData);
        
        document.getElementById('connectBtn').textContent = '✓ Connected';
        document.getElementById('connectBtn').classList.add('connected');
        document.querySelectorAll('button').forEach(b => b.disabled = false);
        document.getElementById('msg').textContent = 'Connected! Ready to scan.';
        
    } catch (e) {
        console.error(e);
        document.getElementById('msg').textContent = 'Connection failed: ' + e.message;
    }
};

function onDisconnect() {
    document.getElementById('connectBtn').textContent = '🔗 Connect';
    document.getElementById('connectBtn').classList.remove('connected');
    document.querySelectorAll('button:not(#connectBtn)').forEach(b => b.disabled = true);
    document.getElementById('msg').textContent = 'Disconnected - tap Connect';
}

function onData(event) {
    try {
        const data = JSON.parse(new TextDecoder().decode(event.target.value));
        console.log('Data:', data);
        updateUI(data);
    } catch (e) {
        console.error('Parse error:', e);
    }
}

async function cmd(command) {
    if (cmdChar) {
        try {
            await cmdChar.writeValue(new TextEncoder().encode(command));
        } catch (e) {
            console.error('Command error:', e);
        }
    }
}

function playAlert() {
    try { document.getElementById('alertSound').play(); } catch(e) {}
}

function updateUI(d) {
    // Status card
    document.getElementById('status').textContent = d.status || 'READY';
    document.getElementById('score').textContent = Math.round(d.score || 0);
    document.getElementById('icon').textContent = icons[d.status] || '❓';
    document.getElementById('statusCard').style.background = colors[d.status] || '#9E9E9E';
    
    // Alert sound
    if (d.status === 'ALERT' && lastStatus !== 'ALERT') playAlert();
    lastStatus = d.status;
    
    // Alert box
    const alertBox = document.getElementById('alertBox');
    if (d.status === 'ALERT') {
        alertBox.textContent = alertMessages.ALERT;
        alertBox.className = 'alert-box alert show';
    } else if (d.status === 'CONCERN') {
        alertBox.textContent = alertMessages.CONCERN;
        alertBox.className = 'alert-box concern show';
    } else {
        alertBox.className = 'alert-box';
    }
    
    // Message
    const msgEl = document.getElementById('msg');
    if (d.msg && (d.msg.includes('⚠️') || d.msg.includes('🚨') || d.msg.includes('📈') || d.msg.includes('✓'))) {
        msgEl.textContent = d.msg;
    } else if (fullMessages[d.status] && d.status !== 'READY') {
        msgEl.textContent = fullMessages[d.status];
    } else if (d.msg) {
        msgEl.textContent = d.msg;
    }
    
    // Step box
    const stepBox = document.getElementById('stepBox');
    if (d.step && d.step.length > 0) {
        stepBox.textContent = d.step;
        stepBox.classList.add('show');
    } else {
        stepBox.classList.remove('show');
    }
    
    // Countdown
    const cdBox = document.getElementById('countdown');
    if (d.countdown && d.countdown > 0) {
        cdBox.textContent = d.countdown;
        cdBox.classList.add('show');
    } else {
        cdBox.classList.remove('show');
    }
    
    // Metrics
    document.getElementById('ratio').textContent = (d.ratio || 1).toFixed(2) + 'x';
    document.getElementById('uvOff').textContent = d.clear_off || 0;
    document.getElementById('uvOn').textContent = d.clear || 0;
    document.getElementById('temp').textContent = d.temp ? d.temp.toFixed(1) + '°C' : '--';
    
    // Reading count
    if (d.clear > 0 && d.status !== 'READY') readingCount++;
    document.getElementById('count').textContent = '#' + readingCount;
    
    // Bacteria
    const bacBox = document.getElementById('bacteriaBox');
    if (d.bacteria && d.bacteria !== 'None') {
        document.getElementById('bacteria').textContent = d.bacteria;
        bacBox.classList.add('show');
    } else {
        bacBox.classList.remove('show');
    }
    
    // Trend
    const trendBox = document.getElementById('trendBox');
    if (d.trend && d.trend !== 'INSUFFICIENT' && d.trend !== 'INSUFF') {
        const arrows = { IMPROVING: '📉', WORSENING: '📈', STABLE: '➡️' };
        const texts = { IMPROVING: 'Improving!', WORSENING: 'Getting worse', STABLE: 'Stable' };
        document.getElementById('trendArrow').textContent = arrows[d.trend] || '➡️';
        document.getElementById('trendText').textContent = texts[d.trend] || d.trend;
        trendBox.classList.add('show');
    } else {
        trendBox.classList.remove('show');
    }
    
    // Confidence
    const conf = d.confidence || 0;
    document.getElementById('confBar').style.width = conf + '%';
    const confLevel = conf >= 75 ? 'HIGH' : conf >= 50 ? 'MEDIUM' : 'LOW';
    document.getElementById('confLevel').textContent = confLevel;
    
    const confBar = document.getElementById('confBar');
    confBar.style.background = conf >= 75 ? '#4CAF50' : conf >= 50 ? '#FF9800' : '#F44336';
}
</script>
</body>
</html>
